      <!-- h -->
      <path d="M190.3 42v-31h5.4v12.4q1-1.4 2.7-2.2 1.7-.8 3.8-.8 3.7 0 5.9 2.3 2.2 2.3 2.2 6.2V42h-5.4V29.9q0-2-1.1-3.1-1.1-1.1-3-1.1-2.1 0-3.4 1.4-1.3 1.4-1.3 3.7V42z"/>
