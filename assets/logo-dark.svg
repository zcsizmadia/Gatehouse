<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 316 64" width="316" height="64"
     role="img" aria-label="Gatehouse">
  <title>Gatehouse</title>

  <!--
    Horizontal lock-up: the mark, then the wordmark, one colour throughout.

    The wordmark is drawn as paths rather than as <text>. SVG text renders in
    whatever font the viewer happens to have, so a shipped logo containing <text>
    is a logo that looks different on every machine — and GitHub, where this is
    mostly seen, is exactly where that variance is least welcome. Paths cost more
    to author and then look the same everywhere.

    The mark below is the same geometry as assets/icon.svg, shifted 3 units left so
    the arch's optical centre lines up with the wordmark's. If one changes, change
    both: a lock-up whose glyph disagrees with the app icon is worse than no
    lock-up at all.
  -->

  <g stroke="currentColor" fill="none" color="#F2F2F5">

    <!-- ── mark ─────────────────────────────────────────────────────────── -->
    <g transform="translate(-3 0)" fill="none">
      <path d="M13 54 V30 A19 19 0 0 1 51 30 V54"
            stroke-width="7" stroke-linecap="round"/>
      <path d="M21 33 H43" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g transform="translate(-3 0)" stroke="none" fill="currentColor">
      <path d="M21.5 19 H26.5 V42 L24 48 L21.5 42 Z"/>
      <path d="M29.5 19 H34.5 V42 L32 48 L29.5 42 Z"/>
      <path d="M37.5 19 H42.5 V42 L40 48 L37.5 42 Z"/>
    </g>

    <!-- ── wordmark ─────────────────────────────────────────────────────────
         A geometric sans on a 24-unit cap height, baseline at y=41.
    -->
    <g stroke="none" fill="currentColor" transform="translate(-14 0)">
      <!-- G -->
      <path d="M96.6 42.4q-4.6 0-8-2t-5.3-5.6q-1.9-3.6-1.9-8.3 0-4.7 2-8.3 2-3.6 5.5-5.6 3.5-2 8-2 3.7 0 6.7 1.4 3 1.4 4.9 4l-4.2 3.7q-1.4-1.8-3.3-2.7-1.9-.9-4.1-.9-2.8 0-4.9 1.3-2.1 1.3-3.3 3.6-1.2 2.3-1.2 5.5 0 3.1 1.2 5.4 1.2 2.3 3.4 3.6 2.2 1.3 5 1.3 2.1 0 3.9-.7 1.8-.7 3-2v-4.2h-7.3v-4.9h12.6v11.5q-2 2.5-5.2 4t-7.2 1.5z"/>
      <!-- a -->
      <path d="M124.6 42.4q-2.3 0-4.1-.9-1.8-.9-2.8-2.4-1-1.5-1-3.5 0-3 2.3-4.8 2.3-1.8 6.6-2l5.6-.3v-.6q0-1.8-1.1-2.7-1.1-.9-3.2-.9-1.8 0-3.1.6-1.3.6-2.1 1.8l-3.4-3q1.4-1.9 3.7-2.9 2.3-1 5.3-1 4.4 0 6.9 2.2 2.5 2.2 2.5 6v13.6h-5.2v-2.6q-1 1.4-2.7 2.2-1.7.8-4.2.8zm1.4-4.2q2.1 0 3.4-1.2 1.3-1.2 1.3-3.1v-1l-4.7.3q-1.9.1-2.8.8-.9.7-.9 1.9 0 1.1.9 1.7.9.6 2.8.6z"/>
