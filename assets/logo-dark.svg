      <!-- u -->
      <path d="M255.4 42.4q-3.8 0-6.1-2.3-2.3-2.3-2.3-6.2V20.8h5.4v12.1q0 2 1.1 3.1 1.1 1.1 3.1 1.1 2.1 0 3.4-1.4 1.3-1.4 1.3-3.7V20.8h5.4V42h-5.3v-2.5q-1 1.4-2.7 2.2-1.7.7-3.3.7z"/>
      <!-- s -->
      <path d="M281.9 42.4q-3 0-5.5-1-2.5-1-4-2.9l3.3-3.2q1.2 1.3 2.8 2 1.6.7 3.5.7 1.5 0 2.4-.5.9-.5.9-1.4 0-.8-.7-1.2-.7-.4-2.5-.8l-2.4-.5q-3.1-.6-4.7-2-1.6-1.4-1.6-3.9 0-2.9 2.3-4.7 2.3-1.8 6.2-1.8 2.7 0 5 .9 2.3.9 3.8 2.6l-3.3 3.2q-1-1.1-2.4-1.7-1.4-.6-3-.6-1.4 0-2.2.4-.8.4-.8 1.2 0 .7.6 1.1.6.4 2.1.7l2.8.6q3.3.7 4.8 2.1 1.5 1.4 1.5 3.9 0 3-2.4 4.9-2.4 1.9-6.4 1.9z"/>
      <!-- e -->
      <path d="M305.4 42.4q-3.3 0-5.9-1.4-2.6-1.4-4-3.9-1.4-2.5-1.4-5.8 0-3.2 1.4-5.7 1.4-2.5 3.9-3.9 2.5-1.4 5.6-1.4 3.1 0 5.5 1.3 2.4 1.3 3.7 3.7 1.3 2.4 1.3 5.6 0 .7-.1 1.3-.1.6-.2 1.1h-15.6q.4 2.2 1.9 3.4 1.5 1.2 3.9 1.2 1.7 0 3.1-.6 1.4-.6 2.3-1.7l3.3 3.1q-1.5 1.8-3.8 2.8-2.3 1-4.8 1zm-.5-17.4q-2 0-3.4 1.1-1.4 1.1-1.9 3.1h10.3q-.3-1.9-1.6-3.1-1.3-1.1-3.4-1.1z"/>
    </g>
  </g>
</svg>
