name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default. Jobs that need more ask for it explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1

jobs:
  # ---------------------------------------------------------------------------
  # Build and test on both platforms Gatehouse claims to support, against every
  # target framework the libraries claim to support. Multi-targeting that nothing
  # exercises is a promise rather than a guarantee.
  # ---------------------------------------------------------------------------
  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # The libraries target net8.0 and net9.0 as well, so those runtimes and
          # targeting packs have to be present or the build cannot resolve them.
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Gatehouse.slnx

      - name: Build
        # TreatWarningsAsErrors is on repository-wide, so this step is also the
        # analyzer, style and AOT-compatibility gate.
        run: dotnet build Gatehouse.slnx --configuration Release --no-restore

      - name: Test — Gatehouse.Core.Tests
        shell: bash
        run: |
          for tfm in net8.0 net9.0 net10.0; do
            echo "::group::Gatehouse.Core.Tests ($tfm)"
            dotnet run --project tests/Gatehouse.Core.Tests \
              --configuration Release --framework "$tfm" --no-build \
              -- --report-trx --report-trx-filename "core-$tfm.trx"
            echo "::endgroup::"
          done

      - name: Test — Gatehouse.Server.Tests
        shell: bash
        # The integration suite hosts a real Kestrel on both sides of the gateway,
        # so it runs only on the application target framework.
        run: |
          dotnet run --project tests/Gatehouse.Server.Tests \
            --configuration Release --framework net10.0 --no-build \
            -- --report-trx --report-trx-filename "server.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # The Phase 0 gate: one NativeAOT binary that actually starts and serves.
  # Publishing without running the result proves only that the linker exited zero,
  # and AOT failures characteristically appear at first use rather than at link.
  # ---------------------------------------------------------------------------
  aot-smoke:
    name: NativeAOT smoke (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            exe: gatehouse
          - os: windows-latest
            rid: win-x64
            exe: gatehouse.exe

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install NativeAOT prerequisites
        if: runner.os == 'Linux'
        # AOT links with clang and needs the zlib headers. Without them the build
        # fails late, in the linker, with a message that does not mention either.
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends clang zlib1g-dev

      - name: Publish NativeAOT
        run: >
          dotnet publish src/Gatehouse.Server
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishAot=true
          --output ${{ github.workspace }}/publish

      - name: Report binary size
        shell: bash
        # A single binary is a headline claim, so its size is reported on every run
        # rather than measured once and quoted forever.
        run: |
          ls -lh "${{ github.workspace }}/publish/${{ matrix.exe }}"
          echo "### NativeAOT binary (${{ matrix.rid }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -lh "${{ github.workspace }}/publish/${{ matrix.exe }}" | awk '{print $5, $9}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test — version
        shell: bash
        # A block scalar, so the quoting belongs to the shell rather than to YAML.
        run: |
          "${{ github.workspace }}/publish/${{ matrix.exe }}" --version

      - name: Smoke test — serve a streamed completion
        shell: bash
        # The whole gate in one script: start the published binary, have it proxy a
        # streamed completion from a stub upstream, and assert the chunks arrive.
        run: bash ./.github/scripts/smoke-test.sh "${{ github.workspace }}/publish/${{ matrix.exe }}"

      - name: Verify the publish output is complete
        shell: bash
        # NativeAOT does not statically link the SQLite native library, so the executable is
        # accompanied by e_sqlite3. Shipping the executable alone yields something that starts,
        # answers a health probe, and then throws DllNotFoundException the first time anything
        # touches the request log — which is every request. Assert the companion is present so
        # a packaging change cannot quietly drop it again.
        run: |
          cd "${{ github.workspace }}/publish"
          ls -la
          if ! ls | grep -Eq 'e_sqlite3'; then
            echo "::error::the SQLite native library is missing from the publish output"
            exit 1
          fi

      - name: Upload publish output
        uses: actions/upload-artifact@v7
        # The whole directory, not just the executable: see the verification step above.
        with:
          name: gatehouse-${{ matrix.rid }}
          path: ${{ github.workspace }}/publish/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Container image. Built on every pull request so packaging breaks are caught
  # with the change that caused them rather than at release time.
  # ---------------------------------------------------------------------------
  docker:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v4.3.0

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v7.3.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          load: true
          tags: gatehouse:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the image runs and reports ready
        # Deliberately no --rm: a container that exits on startup is removed immediately with
        # it, taking its logs — the only useful diagnostic — with it. That is exactly what
        # happens in the failure case this check exists to catch, so the container is kept and
        # removed explicitly in the cleanup step below.
        run: |
          docker run --detach --name gatehouse-ci \
            --publish 18080:8080 \
            --env Gatehouse__Providers__stub__Kind=openai-compatible \
            --env Gatehouse__Providers__stub__BaseUrl=http://127.0.0.1:9/v1 \
            --env Gatehouse__Models__probe__Provider=stub \
            gatehouse:ci

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health/ready; then
              echo "gatehouse reported ready after ${attempt}s"
              exit 0
            fi

            # An exited container will never become ready. Fail now so the logs are the first
            # thing in the output rather than the last thing after a 30-second wait.
            state=$(docker inspect --format '{{.State.Status}}' gatehouse-ci 2>/dev/null || echo missing)
            if [ "$state" != "running" ]; then
              echo "::error::container is '$state' rather than running"
              exit 1
            fi

            sleep 1
          done

          echo "::error::gatehouse did not report ready within 30 seconds"
          exit 1

      - name: Container diagnostics
        if: always()
        run: |
          echo "::group::docker inspect"
          docker inspect --format 'status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}}' gatehouse-ci || true
          echo "::endgroup::"
          echo "::group::container logs"
          docker logs gatehouse-ci 2>&1 || echo "(no logs available)"
          echo "::endgroup::"
          docker rm --force gatehouse-ci >/dev/null 2>&1 || true

  # ---------------------------------------------------------------------------
  # The libraries are a shipped deliverable, not a by-product: a .NET 8 shop is
  # invited to reference Gatehouse.Core, and from Phase 3 the guardrails plugin
  # contract. Packing on every pull request is what keeps that offer honest.
  # ---------------------------------------------------------------------------
  pack:
    name: NuGet packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Pack
        run: dotnet pack Gatehouse.slnx --configuration Release --output ./artifacts

      - name: Verify every package carries all three target frameworks
        shell: bash
        # A packaging regression that quietly drops net8.0 would break consumers
        # while every build and test in this workflow still passed.
        run: |
          set -euo pipefail
          shopt -s nullglob

          packages=(./artifacts/*.nupkg)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "::error::No packages were produced."
            exit 1
          fi

          for pkg in "${packages[@]}"; do
            case "$pkg" in *.symbols.nupkg) continue ;; esac
            echo "::group::$(basename "$pkg")"
            contents=$(unzip -Z1 "$pkg")
            echo "$contents" | grep -E '^lib/|\.nuspec$' || true

            for tfm in net8.0 net9.0 net10.0; do
              if ! echo "$contents" | grep -q "^lib/$tfm/"; then
                echo "::error::$(basename "$pkg") is missing lib/$tfm."
                exit 1
              fi
            done

            # Apache-2.0 with the explicit patent grant is what enterprise legal
            # review asks about, so its presence is asserted rather than assumed.
            if ! echo "$contents" | grep -q 'README.md'; then
              echo "::error::$(basename "$pkg") does not embed the README."
              exit 1
            fi
            echo "::endgroup::"
          done

          echo "All packages carry net8.0, net9.0 and net10.0."

      - uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ./artifacts/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Supply chain. In place from the first commit rather than added before v1.0,
  # because that is the claim SECURITY.md makes.
  # ---------------------------------------------------------------------------
  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Install CycloneDX
        run: dotnet tool install --global CycloneDX

      - name: Generate SBOM
        # One SBOM per shipped artifact. Central Package Management means the
        # dependency graph is declared in a single file, so a reviewer can diff the
        # SBOM against Directory.Packages.props and see that they agree.
        run: |
          dotnet CycloneDX src/Gatehouse.Server/Gatehouse.Server.csproj \
            --output ./sbom \
            --output-format Json \
            --set-name Gatehouse \
            --set-version "0.1.0-alpha"

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: ./sbom
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # A single required check to protect the branch with, so the ruleset does not
  # have to be edited every time the matrix changes.
  # ---------------------------------------------------------------------------
  ci-complete:
    name: CI complete
    if: always()
    needs: [build-test, aot-smoke, docker, pack, sbom]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job did not succeed
        # needs.*.result is checked explicitly: a skipped or cancelled dependency
        # must not be able to report the whole run as green.
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Dependency results: $results"
          for result in $results; do
            if [ "$result" != "success" ]; then
              echo "::error::A required job reported '$result'."
              exit 1
            fi
          done
          echo "All required jobs succeeded."
