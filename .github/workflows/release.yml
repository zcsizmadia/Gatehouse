name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, without the leading v
        required: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  # ---------------------------------------------------------------------------
  # One NativeAOT binary per platform, each signed and attested. SECURITY.md
  # promises signed releases, an SBOM per artifact and SLSA provenance from the
  # first commit rather than before v1.0, so this workflow exists now even though
  # nothing has been released yet.
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  rid: linux-x64,   exe: gatehouse }
          - { os: ubuntu-24.04-arm, rid: linux-arm64, exe: gatehouse }
          - { os: windows-latest, rid: win-x64,     exe: gatehouse.exe }
          - { os: macos-latest,   rid: osx-arm64,   exe: gatehouse }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Install NativeAOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends clang zlib1g-dev

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

      - name: Publish
        shell: bash
        # VersionSuffix is cleared explicitly. Directory.Build.props defaults it to
        # "alpha" for untagged builds, and a release artifact labelled alpha is the
        # kind of mistake nobody notices until a customer asks about it.
        run: >
          dotnet publish src/Gatehouse.Server
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishAot=true
          -p:VersionPrefix=${{ steps.version.outputs.version }}
          -p:VersionSuffix=
          --output ./publish

      - name: Verify the binary runs
        shell: bash
        run: ./publish/${{ matrix.exe }} --version

      - name: Smoke test
        # See the same bound in ci.yml: a hung step reports no cause and holds a
        # runner until the job limit.
        timeout-minutes: 15
        shell: bash
        run: bash ./.github/scripts/smoke-test.sh "./publish/${{ matrix.exe }}"

      - name: Stage artifact
        shell: bash
        # An archive, not a bare executable. NativeAOT does not statically link the SQLite
        # native library, so the executable ships alongside e_sqlite3; publishing the
        # executable on its own would hand every user something that starts and then throws
        # DllNotFoundException on the first request. Debug symbols are excluded from the
        # archive and published separately below.
        run: |
          set -euo pipefail
          rm -f ./publish/*.dbg ./publish/*.pdb

          if ! ls ./publish | grep -Eq 'e_sqlite3'; then
            echo "::error::the SQLite native library is missing from the publish output"
            exit 1
          fi

          mkdir -p staging
          name="gatehouse-${{ matrix.rid }}"

          if [ "${{ runner.os }}" = "Windows" ]; then
            (cd ./publish && 7z a -tzip "../staging/${name}.zip" .) > /dev/null
          else
            tar -czf "staging/${name}.tar.gz" -C ./publish .
          fi

          ls -lh staging

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binary-${{ matrix.rid }}
          path: staging/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Sign, attest and publish. Kept separate from the build so that the signing
  # identity is bound to one auditable job rather than to four.
  # ---------------------------------------------------------------------------
  publish:
    name: Sign and publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Keyless Sigstore signing and build attestations both use the workflow
      # OIDC identity, which is what binds an artifact to this repository and this
      # workflow rather than to a key somebody has to keep secret.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          merge-multiple: true
          path: ./release

      - name: Generate SBOM
        run: |
          dotnet tool install --global CycloneDX
          dotnet CycloneDX src/Gatehouse.Server/Gatehouse.Server.csproj \
            --output ./release \
            --output-format Json \
            --set-name Gatehouse \
            --set-version "${GITHUB_REF_NAME#v}"

      - name: Checksums
        working-directory: ./release
        run: sha256sum * > SHA256SUMS

      - name: Sign artifacts with Sigstore
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: ./release/gatehouse-*

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: ./release/gatehouse-*

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: ./release/*
          generate_release_notes: true
          # Pre-release until v1.0. The API-stability guarantee arrives with 1.0,
          # and marking these as stable would misrepresent that.
          prerelease: ${{ !startsWith(github.ref_name, 'v1.') }}
          body: |
            See [CHANGELOG.md](https://github.com/zcsizmadia/Gatehouse/blob/main/CHANGELOG.md).

            **Verifying this release** — instructions are in
            [SECURITY.md](https://github.com/zcsizmadia/Gatehouse/blob/main/SECURITY.md#verifying-a-release).
            Every binary ships with a Sigstore bundle, a CycloneDX SBOM and SLSA
            build provenance. If verification fails, treat the artifact as
            compromised and tell us.

  # ---------------------------------------------------------------------------
  # Push the libraries to nuget.org.
  #
  # Deliberately last, and gated on `publish` rather than on `build`. A GitHub
  # release can be deleted; a NuGet package cannot. It can be unlisted, which hides
  # it from search and leaves it installable forever by anyone who names the
  # version. So everything revocable happens first, and the one irreversible step
  # runs only once the binaries, the smoke tests, the signatures and the release
  # have all succeeded.
  #
  # The Server is not packable: it ships as the signed binaries above, not as a
  # library. Only the seven libraries a .NET shop would reference go here.
  # ---------------------------------------------------------------------------
  nuget:
    name: Push to NuGet
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Pack
        # VersionSuffix is cleared for the same reason as the binary build: the
        # default appends "alpha" to untagged builds, and a package labelled
        # 0.1.0-alpha when the tag said beta.1 is a mistake that cannot be taken back.
        run: >
          dotnet pack Gatehouse.slnx
          --configuration Release
          -p:VersionPrefix=${{ steps.version.outputs.version }}
          -p:VersionSuffix=
          --output ./packages

      - name: Verify the packages carry the tagged version
        shell: bash
        # The last chance to catch a version mismatch. After the next step the
        # version is public forever, so this compares what was actually produced
        # against what the tag asked for rather than trusting the pack arguments.
        run: |
          set -euo pipefail
          expected="${{ steps.version.outputs.version }}"
          failed=0

          shopt -s nullglob
          packages=(./packages/*.nupkg)

          if [ ${#packages[@]} -eq 0 ]; then
            echo "::error::pack produced no packages"
            exit 1
          fi

          for package in "${packages[@]}"; do
            case "$(basename "$package")" in
              *".$expected.nupkg") echo "ok   $(basename "$package")" ;;
              *) echo "::error::$(basename "$package") is not version $expected"; failed=1 ;;
            esac
          done

          [ "$failed" -eq 0 ] || exit 1
          echo "${#packages[@]} package(s) at $expected"

      - name: Push
        # --skip-duplicate so re-running a failed release is safe: a version already
        # on nuget.org is left alone instead of failing the job. The matching .snupkg
        # symbol package is picked up automatically from the same directory.
        run: >
          dotnet nuget push "./packages/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ secrets.NUGET_API_KEY }}
          --skip-duplicate
